name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_5ADJjttgTBouoIYWUrrQlSfb
  VERCEL_PROJECT_ID: prj_WxQZwsLPTnSDKCSe8QkD49hVxRRI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
